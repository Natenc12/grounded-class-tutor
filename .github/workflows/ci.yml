# Required local product gates. Neither job uses hosted services or live model calls.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-python-test:
    name: Local Python core (no hosted dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.10"
      UV_LOCKED: "1"
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install Python 3.10
        run: uv python install 3.10

      - name: Install only local runtime and test dependencies
        run: uv sync --extra dev

      - name: Assert hosted packages are absent
        run: |
          uv run python - <<'PY'
          from importlib.util import find_spec
          forbidden = ("psycopg", "pgvector", "openai", "dotenv", "fastapi",
                       "uvicorn", "python_multipart", "httpx2")
          present = [name for name in forbidden if find_spec(name) is not None]
          assert not present, f"Hosted dependencies leaked into the local environment: {present}"
          PY

      - name: Lint and format
        run: |
          uv run ruff check
          uv run ruff format --check .

      - name: Test local parser, core, library and bridge
        run: uv run pytest

      - name: Check retrieval-study scoring and safe asset downloads with fakes
        run: |
          uv run python eval/local-embeddings/test_runner.py
          uv run pytest eval/local-embeddings/runtime/test_download_assets.py

      - name: Measure synthetic retrieval without model calls
        run: |
          uv run python -m gct.eval.local_quality --suite eval/local-quality/suite.json > /tmp/gct-development-quality.json
          uv run python -m gct.eval.local_quality --suite eval/local-quality/aster.json > /tmp/gct-aster-quality.json
          uv run python -m gct.eval.local_quality --suite eval/local-quality/embedding-holdout.json > /tmp/gct-holdout-quality.json
          uv run python - <<'PY'
          import json
          from pathlib import Path
          for name in ("development", "aster", "holdout"):
              report = json.loads(Path(f"/tmp/gct-{name}-quality.json").read_text())
              print(name, json.dumps(report["retrieval"]))
          PY

  desktop-test:
    name: Desktop build + mocked integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      UV_PYTHON: "3.10"
      UV_LOCKED: "1"
      # These tests use the real Python bridge with synthetic documents and mock
      # account/network responses. No database service or live credentials belong here.
      PYTHON_DOTENV_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      - name: Install Python 3.10
        run: uv python install 3.10

      - name: Sync only local Python dependencies
        run: uv sync --extra dev --locked

      - name: Install Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build desktop SDK and run mocked tests
        working-directory: desktop
        run: npm test
