# Per-PR merge gate: lint + every test that runs for free (issue #18, extended).
# Trust is the product, so a red suite must BLOCK merge instead of relying on a
# "tests pass" claim typed into a PR body. The job needs no database and no service:
# the tutor keeps everything in one SQLite library file, which tests make in a temp
# folder (#254). Only `live` tests (a real model) stay local-only.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same PR/branch cancels the older, still-running job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest + drive  # not required by name; merge-check below is (#251, #254)
    runs-on: ubuntu-latest
    # State our own floor rather than inheriting the repo default, which is a setting someone can
    # flip elsewhere: this job only ever reads code, so a write-scoped GITHUB_TOKEN here would be
    # a standing offer to any dependency that runs in it.
    permissions:
      contents: read
    # Pin the interpreter for every uv command below. Without this, `uv python
    # install 3.14` only makes 3.14 available — `uv sync`/`uv run` could still
    # resolve a different Python, so the suite might not run on the 3.14 that
    # `.python-version` pins locally.
    # A hung job should fail in minutes, not burn the 360-minute default. The suite runs in ~30s;
    # anything near 10 minutes means a test is stuck (a lock or a wait), not working hard.
    timeout-minutes: 10
    env:
      UV_PYTHON: "3.14"
      # Applies --locked to EVERY uv command below, `uv run` included. Two things this buys:
      # `uv run` re-locks and re-syncs by default, so without it a dep added to pyproject.toml
      # but never `uv lock`ed gets resolved and installed mid-job — CI goes green against a
      # dependency set uv.lock does not describe, while a teammate's `uv sync` gets a different
      # environment. And --locked ASSERTS the lockfile is current (--frozen merely declines to
      # touch it), so a stale uv.lock is itself a red. Same reproducibility argument as pinning
      # the actions below to a commit.
      # NB: --frozen and --locked are mutually exclusive — with this set, passing `--frozen` to
      # any step below is a hard error ("the argument `--locked` cannot be used with UV_FROZEN").
      UV_LOCKED: "1"
    steps:
      # Third-party actions are pinned to a commit SHA, not a tag, so the gate is reproducible:
      # `@v4` is mutable and these run arbitrary code in a job holding GITHUB_TOKEN, so a
      # republished tag would change what executes here with no diff to review. The trailing
      # comment is the human-readable version — bumping means editing both, deliberately.
      # (Note `refs/tags/v5` on setup-uv resolves to an annotated TAG object, which Actions will
      # not accept; the SHA below is the commit that tag points at.)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          enable-cache: true

      # Match local dev: 3.14 is the one supported Python (`.python-version`,
      # requires-python >=3.14), so a green CI reproduces for Nate locally.
      - name: Install Python 3.14
        run: uv python install 3.14

      # `--extra dev` is required: pytest/ruff live in [project.optional-dependencies].dev,
      # which a bare `uv sync` does NOT install (it actively UNINSTALLS them).
      # Pinning comes from UV_LOCKED above, not a --frozen flag here — the two conflict.
      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: uv run ruff check

      # Formatting is a separate gate from lint: `ruff check` never reformats, so before this
      # step layout was whatever each PR happened to type, and review time went to it. `--check`
      # only reports — it never writes — so a red here means "run `uv run ruff format`", not a
      # mystery. The one-time flush that made this green is the commit before it.
      - name: Ruff format
        run: uv run ruff format --check .

      # The whole tutor, end to end, in one process: a throwaway library, two generated course
      # files, a cited answer and a refusal. It always uses the free stand-in model, whatever the
      # environment says, so it needs no database and no paid service (#188). Not retried: a
      # flaky step gets fixed. It finishes in about a second; two minutes means it is stuck.
      - name: Drive the whole tutor (free stand-in, throwaway library)
        timeout-minutes: 2
        run: uv run python tools/drive.py

      - name: Tests (everything except paid-API `live`)
        run: uv run pytest -m "not live"

  # The one required check from this workflow (#251). It runs nothing itself: it passes only when
  # every job it needs finished with `success`. A new job joins the gate by being added to
  # `needs:` below, so adding, renaming or splitting jobs never touches the branch rule or the
  # ruleset again (#173 is what that costs otherwise). Every other job in this file belongs here.
  #
  # `if: always()` is load-bearing. Without it, a failed job makes this one SKIPPED, and GitHub
  # counts a skipped required check as passing. With it, this job always runs and reports, and
  # the step fails on anything but `success`: `failure`, `cancelled`, or `skipped` (a job skipped
  # by its own `if:` proved nothing). A run cancelled by `concurrency` above therefore goes red
  # here; that run's commit is no longer the head, and the newer run is the one that counts.
  merge-check:
    name: merge-check  # required by this exact name; do not rename
    needs: [lint-and-test]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 2
    steps:
      - name: Every job it needs succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'length > 0 and all(.[]; .result == "success")' > /dev/null
