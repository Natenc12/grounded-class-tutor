[project]
name = "grounded-class-tutor"
version = "0.1.0"
description = "A study tutor grounded in your own course materials — cited answers or an honest refusal."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=6.14.2",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gct"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
    "live: test requires a live external dependency (OpenAI API key or Postgres). Excluded from the per-PR CI gate, which runs `pytest -m 'not live'` (issue #18). No tests carry this marker yet — it fences off the live/DB tests arriving in later slices.",
]
