[project]
name = "grounded-class-tutor"
version = "0.1.0"
description = "A study tutor grounded in your own course materials — cited answers or an honest refusal."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gct"]

[tool.ruff]
line-length = 100
