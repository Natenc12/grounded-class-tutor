[project]
name = "grounded-class-tutor"
version = "0.1.0"
description = "A study tutor grounded in your own course materials — cited answers or an honest refusal."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=6.14.2",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gct"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Ruff's default is F + a slice of E, which notably EXCLUDES E501 — so `line-length` above was
# decorative and a 300-character line passed the merge gate. Selecting E makes the number real.
# The rest are small and load-bearing for this codebase: I sorts imports (a permanent source of
# noise diffs otherwise), UP keeps us on 3.10 idiom, and B is the bug-shaped one — B905 in
# particular forces `zip(..., strict=)`, and a silently-truncating zip over chunks/vectors is
# exactly the kind of thing that would corrupt an index without ever raising.
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# --strict-markers: applying an unregistered mark is an ERROR, not a silently-ignored no-op. It
#   guards mark APPLICATION — here, the one `add_marker("db")` call in tests/conftest.py, which
#   would otherwise accept a typo'd name and quietly under-collect `-m db`. It does NOT validate
#   `-m` EXPRESSIONS: `pytest -m "not livee"` collects all 82 without a word of complaint, so the
#   gate string in .github/workflows/ci.yml is unguarded and fails OPEN. Nothing in pytest can
#   check that string; only a collected-count floor could. Know which half you're covered on.
# --strict-config: an unknown or misspelled key in this very section is a hard ERROR instead of a
#   warning nobody reads (`markers` typo'd as `marker` would silently un-register both marks).
#   One blind spot it cannot cover, by construction: a typo in `addopts` ITSELF, since that's the
#   key carrying the flag — misspell it and both strict flags vanish with it.
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "db: test needs a real Postgres (fake embedders — no network, no cost). Runs locally against the dev DB and in CI against the pgvector service container, after the migrate step. The shared `db` fixture skips locally when Postgres is down, but HARD-FAILS in CI, where the container guarantees one. NOT hand-applied: `pytest_collection_modifyitems` in tests/conftest.py adds it to anything requesting the `db` fixture, so the mark can't drift from the dependency.",
    "live: test hits a paid external API (OpenAI). Excluded from the per-PR CI gate, which runs `pytest -m 'not live'` (issue #18) — these run locally only, with .env secrets. NO test carries this yet: the write-path tests that used to were really `db` tests mis-labelled, and the first true carrier will be the #8 ask-smoke. Kept registered because that gate has to exist BEFORE the first paid test lands, not after. Distinct from `db` on purpose: conflating them would either spend money in CI or silently fence off free DB coverage. UNLIKE `db`, this mark is hand-declared with nothing deriving it, and it fails in the dangerous direction: a paid test that FORGETS the mark runs in CI. Derive it from an OpenAI-client fixture the way `db` is derived when #8 lands.",
]
