[project]
name = "grounded-class-tutor"
version = "0.1.0"
description = "A study tutor grounded in your own course materials — cited answers or an honest refusal."
requires-python = ">=3.10"
dependencies = [
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "pypdf>=6.14.2",
    "python-pptx>=1.0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "reportlab>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gct"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
# --strict-markers: an unregistered mark is an ERROR, not a silently-ignored no-op. The whole
# CI gate is a marker expression, so a typo'd `@pytest.mark.bd` must not quietly under-collect
# `-m db` while still looking green.
addopts = ["--strict-markers"]
markers = [
    "db: test needs a real Postgres (fake embedders — no network, no cost). Runs locally against the dev DB and in CI against the pgvector service container, after the migrate step. The shared `db` fixture skips locally when Postgres is down, but HARD-FAILS in CI, where the container guarantees one. NOT hand-applied: `pytest_collection_modifyitems` in tests/conftest.py adds it to anything requesting the `db` fixture, so the mark can't drift from the dependency.",
    "live: test hits a paid external API (OpenAI). Excluded from the per-PR CI gate, which runs `pytest -m 'not live'` (issue #18) — these run locally only, with .env secrets. NO test carries this yet: the write-path tests that used to were really `db` tests mis-labelled, and the first true carrier will be the #8 ask-smoke. Kept registered because that gate has to exist BEFORE the first paid test lands, not after. Distinct from `db` on purpose: conflating them would either spend money in CI or silently fence off free DB coverage.",
]
